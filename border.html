<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3
        {
            border-style:dotted;
            border-color: crimson;
        }
        h2
        {
            border-style: dashed;
        }
        h1
        {
            border-style: solid;
            border-color: blue;
        }
        h4{
            border-style: groove;
            border-color: darkseagreen;
        }
        h5{
            border-style: outset;
            border-color: darkorange;
        }
        h6{
            border-style: inset;
        }
        span{
            background-color: red;
            border: 5px double black;
            color: white;
        }
    </style>
</head>
<body>
    <h1>pkcreation</h1>
    <h3>hello welcome </h3>
    <h2>fortune cloud</h2>
    <h4>maha metro</h4>
    <h5>pune</h5>
    <h6>laptop</h6>
    <span>wagholi</span>
    
</body>
</html>
