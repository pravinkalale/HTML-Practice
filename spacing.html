<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacing</title>
    <style>
        p{
            letter-spacing: 7px;
            text-align: center;
            padding-top: 20px;
            color: darkred;
            font-family: Arial, Helvetica, sans-serif;
        }
        #v
        {
            word-spacing: 7px;
            font-family: Arial, Helvetica, sans-serif;
            color: blue;
        }
    </style>
</head>
<body>
    <p>this is a paragraph</p>
    <p id="v">Pravin</p>
</body>
</html>
