<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
         div{
            height: 150px;
            width: 150px;
            background-image: url(images.jpg);
            background-size: cover;
            position: relative;
            animation: khunkhar 5s;
        }
        @keyframes khunkhar
        {
            0%{background-image: url(images.jpg); left:0px; top:0px;} 
            25%{background-image: url(picture.jpg); left:300px; top:0px;} 
            50%{background-image: url(image1.jpg); left:300px; top:200px;} 
            75%{background-image: url(image1.jpg); left:0%; top:200px;} 
            100%{background-image: url(images.jpg); left:0%; top:0px;} 
            
        } 
        
    </style>
</head>
<body>
    <div></div>
</body>
</html>
