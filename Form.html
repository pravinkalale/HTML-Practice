<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body bgcolor="lightgrey">
    <marquee behavior="scroll" direction="right" bgcolor="pink">REGISTRATION FORM </marquee>
    <marquee behavior="slide" direction="right" bgcolor="lightblue">REGISTRATION FORM </marquee>
    <marquee behavior="alternate" direction="right" bgcolor="lightred">REGISTRATION FORM 
    </marquee>

    <form >
        <fieldset style="width: 20%; margin: auto;">
        <!---- registration form -->

        <center><legend>Registration_form</legend></center><br>

        <!--Name-->

        <label for="Name">Name:</label>
        <input type="text" id="Name" placeholder="Enter your name"><br><br>

        <!--email-->
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>

        <!--password-->

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password"><br><br>

        <!--contact-->

        <label for="contact">Contact:</label>
        <input type="number" id="contact" placeholder="Enter your contact"><br><br>

        <!--date_of_birth-->
        
        <label for="DOB">Date_of_Birth:</label>
        <input type="date" id="DOB" placeholder="Enter your date of birth"><br><br>

        <!--address-->
        
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="Enter your Address"><br><br>

        <!--gender-->

        <label for="gender">gender:</label>
        <input type="radio" id="gender" name="Gender" value="Male">Male
        :<input type="radio" name="Gender" value="Female">Female<br><br>

        <label for="txt">Second address:</label>
        <textarea id="address" id="txt" name="address" rows="4" cols="40" placeholder="Enter your Address"></textarea><BR></BR>

        <select name="city" id="city">
                <option value="">select city</option>
                <option value="NANDED">NANDED</option>
                <option value="PUNE">PUNE</option>
                <option value="MUMBAI">MUMBAI</option>
        </select><BR></BR>

        <input type="submit" value="submit">
        <button type="submit">submit</button>
        </fieldset>
        
    </form><br>

    <img src="Profile.jpg" alt="pofile_photo" height="100" width="200">

    <head>
        <body>
            <div style="border: 20%; padding:20px; font: size 20px;">

            if you will do <del>hard work</del> <ins>smart work</ins> then you will get success easily

        </body>
    </head>

    <audio controls src="ringtone.mp3"></audio>
    <div align="right">
    <video controls src="video.mp4" width="500" height="300"  ></video>

</body>
</html>
