<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font color</title>
    <style>
        h1
        {
            color: red;
            font-size: smaller;
        }
        h2{
            color: #9000a1;
            font-size: x-large;
        }
        p{
            color: rgb(0, 220, 98);
            font-size: larger;
        }
    </style>
</head>
<body>
    <h1>welcome</h1>
    <h2>whatsapp</h2>
    <p>instagram (this is a paragraph)</p>
</body>
</html>
