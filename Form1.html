<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body bgcolor="lightgrey">

    <h1>Registration Form</h1>

    <form>

        <!-- Full Name -->
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <br><br>

        <!-- Mobile Number -->
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number">
        <br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <!-- Gender -->
        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <!-- Hobbies -->
        <label>Hobbies:</label>

        <input type="checkbox" id="coding" name="hobby" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="music" name="hobby" value="music">
        <label for="music">Music</label>

        <input type="checkbox" id="travel" name="hobby" value="travel">
        <label for="travel">Travelling</label>

        <br><br>

        <!-- City -->
        <label for="city">City:</label>

        <select id="city" name="city">
            <option value="">Select City</option>
            <option value="pune">Pune</option>
            <option value="mumbai">Mumbai</option>
            <option value="nanded">Nanded</option>
            <option value="nagpur">Nagpur</option>
        </select>

        <br><br>

        <!-- Address -->
        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="4" cols="40"
            placeholder="Enter your address"></textarea>

        <br><br>

        <!-- Terms and Conditions -->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions</label>

        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
