<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
</head>
<body>
    <form>
        <div class="row">

            <div class=" col-md-6 mb-3">
                <label class="form-label"> Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your full Name">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="emial" class="form-control" placeholder="Enter your email">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Password:</label>
                <input type="password" class="form-controls" placeholder="Enter password">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" placeholder="Enter mobile number">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control">
            </div>
            
        <!--Radio button-->

            <div class="col-md-6 mb-3">
                <label class="form-label">Gender</label>
        

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="male">
                <label class="form-check-label" for="male">Male</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="femail">
                <label class="form-check-label" for="female">Female</label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender"
                id="other">
                <label class="form-check-label" for="other">Other</label>
            </div>
        </div>

        <!--Chechbox-->

        <div class="col-md-6 mb-3">
            <label class="form-label">Skills</label>
        
        
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="html">
            <label class="form-check-label" for="html">HTML</label>
        </div>

        <div class="form-check">
            <input  class="form-check-input" type="checkbox" id="css">
            <label class="form-check-label" for="css">CSS</label>
        </div>

        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="python">
            <label for="python" class="form-check-label">Python</label>
        </div>
        </div>

        <!--select tag-->

        <div class="col-md-6 mb-3">
            <label class="form-label">City</label>

            <select class="form-select">
                <option selected>Select City</option>
                <option>Pune</option>
                <option>Mumbai</option>
                <option>Nanded</option>
            </select>
        </div>

        <!--Textarea-->

        <div class="col-md-6 mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" rows="3" placeholder="Enter your address"></textarea>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Upload Resume</label>
            <input type="file" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-secondary">Reset</button>
        </div>

    </form>
</body>
</html>
