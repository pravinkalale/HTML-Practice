<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>circle</title>
    <style>

            display: flex;

        }

            font-size: 40px;
            display: flex;
        }
        #phone
        {
            height: 60px;
            width: 60px;
            background-color: black;
            justify-content: center;
            border-radius: 50px;
            margin: auto;
            font-size: 35px;
            align-items: center;
            display: flex;
        }
    </style>
</head>
<body>
    <div class="user-icon">👤</div><br>
    <div id="div1">❤️</div><br>
    <div id="phone">📵</div>

</html>
