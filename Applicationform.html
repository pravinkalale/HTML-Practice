<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application_form</title>
    <link rel="stylesheet" href="style.css">
    <style>
        submit:hover{
            color: blueviolet;
        }
    </style>
</head>
<body>
    <marquee behavior="scroll" direction="right" bgcolor="orange">Job_opening</marquee>
    <h1>This is Application form</h1>
   
    <form>
        <fieldset>
        
        <!--application form-->
        <center><legend>Application Form</legend></center>

        <h3>Personal Details</h3>

        <!--full name-->
        <label for="fullname">Full Name:</label>
        <input type="text" id="pmk" name="fullname" placeholder="Enter your name">
        <br><br>
        
        <!--email-->
        <label for="email">Email: <span class="required">*</span> </label>
        <input type="email" id="pmk" name="email" placeholder="Enter your email" required>
        <br><br>

        <!--mobile number-->
        <label for="contact">Mobile Number: <span class="required">*</span> </label>
        <input type="tel" id="pmk" name="Mobile Number" placeholder="Enter your mobile number" required>
        <br><br>

        <!--date of birth-->
        <label for="DOB">Date_Of_Birth:</label>
        <input type="date" name="DOB" id="pmk">
        <br><br>

        <!--gender-->
        <label>Gender:</label>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male" required >male</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">female</label>

        <input type="radio" name="gender" id="other" value="other">
        <label for="other">other</label>

        <br><br>

        <!--Education-->
        <h3>Education</h3>
        
        <label for="education">Education:</label>
        <select name="education" id="pmk
        ">
            <option value="">select education</option>
            <option value="BCA">BCA</option>
            <option value="Bsc">Bsc</option>
            <option value="BTech">BTech</option>
            <option value="MCA">MCA</option>
            <option value="Msc">Msc</option>
            <option value="other">other</option>
        </select>
        <br><br>

        <!--passing year-->
        <label for="year">Passing year:</label>
        <input type="number" name="passing_year" id="pmk">
        <br><br>
        
        <!--percentage-->
        <label for="percentage">Percentage/CGPA:</label>
        <input type="text" id="pmk" name="percentage">
        <br><br>

        <h3>Job Details</h3>
        <!--job details-->
        <label for="position">Position Applying For:</label>
        <select name="position" id="pmk">
            <option value="Select Position">Select Position</option>
            <option value="Python Developer">Python Developer</option>
            <option value="Web Developer">Web Developer</option>
            <option value="Software Engineer">Software Engineer</option>
            <option value="Data Analyst">Data Analyst</option>
        </select>
        <br><br>

        <!--experience-->
        <label>Experience:</label>

        <input type="radio" name="experience" id="fresher">
        <label for="fresher">Fresher</label>

        <input type="radio" name="experience" id="1-2 year">
        <label for="1-2 year">1-2 Years</label>

        <input type="radio" name="experience" id="3+ years">
        <label for="3+ years">3+ Years</label>
        <br><br>

        <!--skills-->
        <h3>Skills</h3>

        <label>Skills:</label>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" valu="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" valu="javascript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" id="python" valu="python">
        <label for="python">Python</label>

        <input type="checkbox" id="sql" valu="sql">
        <label for="sql">SQL</label>
        <br><br>

        <!--Other info-->

        <h3>Other Information</h3>
        <label for="resume">Resume upload:</label>
        <br>
        <input type="file" id="resume" name="resume">
        
        <br><br>

        <label for="address">Address:</label>
        <br>
        <textarea name="address" id="pmk" rows="4" cols="40" placeholder="Enter your Address"></textarea>
        <br><br>

        <label for="hire">Why should we hire you?</label>
        <br>
        <textarea name="hire" id="pmk" rows="5" cols="40"></textarea>
        <br><br>

        <!--declaration-->
        <input type="checkbox"  id="declaration" required>
        <label for="declaration">I confirm that information provided above is correct. </label>
        <br><br>

        <!--submil-->
        <input type="submit" id="submit_btn" value="Apply">
        <input type="reset" id="reset_btn" value="Reset">

        
        </fieldset>
    </form>
</body>
</html>
